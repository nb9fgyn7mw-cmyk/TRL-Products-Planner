<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBEFF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRL Calendar">
<title>The Romanticized Life — Product Calendar</title>
<style>
:root{
  --bg:#FBEFF0; --paper:#FFF8F8; --ink:#3B1420; --soft:#7A5560; --line:#EBCFD4;
  --cherry:#B8233A; --cherry-soft:#F6D6DB; --sage:#5E7A5A; --sage-soft:#DDE7D9;
  --butter:#F3E3A3; --warn:#9A3B00; --warn-soft:#FBE3D0;
  --display:"Bodoni 72","Didot","Bodoni MT",Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E0D12; --paper:#2A141A; --ink:#F6E1E5; --soft:#C9A3AC; --line:#4A2530;
    --cherry:#F0667C; --cherry-soft:#4A1C26; --sage:#A9C4A3; --sage-soft:#26352A;
    --butter:#5A4A1E; --warn:#FFB47A; --warn-soft:#4A2A14;
  }
}
:root[data-theme="dark"]{
  --bg:#1E0D12; --paper:#2A141A; --ink:#F6E1E5; --soft:#C9A3AC; --line:#4A2530;
  --cherry:#F0667C; --cherry-soft:#4A1C26; --sage:#A9C4A3; --sage-soft:#26352A;
  --butter:#5A4A1E; --warn:#FFB47A; --warn-soft:#4A2A14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 80px}

header.brand{padding:28px 0 10px}
.brand h1{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(2.3rem,9vw,3.6rem);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:8px 0 0;color:var(--soft);font-size:.98rem}
.savestate{font-size:.8rem;color:var(--soft);margin-top:6px;min-height:1.2em}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:999px;font-weight:500;color:var(--soft);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:14px 14px 14px 4px;padding:8px 12px;cursor:pointer;text-align:left;min-width:74px}
.chip b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.1rem;line-height:1.1}
.chip span{font-size:.75rem;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--cherry);border-color:var(--cherry);color:#fff}
.chip[aria-pressed="true"] span{color:#fff;opacity:.85}
.chip.add{border-style:dashed;color:var(--soft);font-weight:500}

.month{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}
.month h2{font-family:var(--display);font-weight:500;font-size:clamp(1.8rem,6vw,2.4rem);margin:0;line-height:1.1}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:.82rem;color:var(--soft);margin-bottom:4px;font-weight:500}
input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:70px;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}

.section-h{font-family:var(--display);font-style:italic;font-size:1.35rem;font-weight:500;margin:26px 0 8px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.totals div{background:var(--bg);border-radius:12px;padding:10px}
.totals small{display:block;color:var(--soft);font-size:.78rem}
.totals strong{font-size:1.1rem}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700}
.item .meta{font-size:.85rem;color:var(--soft)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--cherry-soft);color:var(--ink);margin-right:4px}
.due{font-size:.85rem;font-weight:700;color:var(--sage)}
.due.late{color:var(--warn)}
.pill{border:0;border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap}
.st-idea{background:var(--line)}
.st-sampling{background:var(--butter)}
.st-ordered{background:var(--cherry-soft)}
.st-arrived{background:var(--sage-soft)}
.st-live{background:var(--sage);color:var(--paper)}
select.pill{width:auto;appearance:none;-webkit-appearance:none;text-align:center}

.empty{color:var(--soft);padding:10px 0;font-size:.95rem}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;color:var(--warn);border:1px solid var(--warn)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nums{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:8px}
.nums b{font-weight:700}
.link{color:var(--cherry);word-break:break-all}
.textbtn{background:none;border:0;color:var(--cherry);font-weight:700;cursor:pointer;padding:6px 0}

.brandpage .lede{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.4;margin:0 0 8px}
.brandpage textarea{min-height:120px}

dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(40,10,20,.45)}
.sheet{padding:20px;overflow:auto;max-height:90vh}
.sheet h3{font-family:var(--display);font-weight:500;font-size:1.6rem;margin:0}
.calc{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:.9rem}
.startbox{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;text-align:left}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1 id="brandName">The Romanticized Life</h1>
    <p id="brandTag">Product calendar</p>
    <div class="savestate" id="saveState" aria-live="polite">Loading your plan…</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="calendar" aria-selected="true">Calendar</button>
    <button role="tab" data-tab="products" aria-selected="false">Products</button>
    <button role="tab" data-tab="brand" aria-selected="false">Brand</button>
  </nav>
  <main id="view"></main>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

function setSave(t){$("#saveState").textContent=t}
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));setSave("Saved on this device")}
  catch(e){setSave("Couldn’t save. Download a backup from the Brand tab.")}
}
function init(){
  try{const s=localStorage.getItem(LS_KEY);if(s)state=JSON.parse(s)}catch(e){}
  if(!state){state=JSON.parse(JSON.stringify(SEED));persist()}
  normalize();selMonth=pickStartMonth();loaded=true;setSave("Saved on this device");render();
}
function normalize(){
  state.brand=state.brand||{name:"The Romanticized Life",tagline:"",mission:"",about:""};
  state.months=state.months||[];state.products=state.products||[];
}
function pickStartMonth(){const k=curKey();return state.months.find(m=>m.key>=k)?.key||state.months[0]?.key||null}
function startPlan(){
  const months=[];let k=curKey();for(let i=0;i<12;i++){months.push({key:k,theme:"",aesthetic:"",focus:""});k=nextKey(k)}
  state={brand:{name:"The Romanticized Life",tagline:"Romanticize every season.",mission:"",about:""},months,products:[]};
  selMonth=months[0].key;persist();render();
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  if(state){$("#brandName").textContent=state.brand.name||"The Romanticized Life";$("#brandTag").textContent=state.brand.tagline||"Product calendar"}
  const v=$("#view");
  if(!loaded){v.innerHTML=`<p class="empty">Loading your plan…</p>`;return}
  if(!state){v.innerHTML=`<div class="startbox"><h2 class="section-h" style="margin-top:0">No plan yet</h2>
    <p class="empty">Start a 12‑month calendar beginning this month. You can add months, products and your brand story as you go.</p>
    <button class="btn" id="startBtn">Start my plan</button></div>`;$("#startBtn").onclick=startPlan;return}
  if(tab==="calendar")renderCalendar(v);else if(tab==="products")renderProducts(v);else renderBrand(v);
}

function renderCalendar(v){
  if(!state.months.find(m=>m.key===selMonth))selMonth=state.months[0]?.key;
  const chips=state.months.map(m=>{const n=state.products.filter(p=>p.month===m.key).length;
    return `<button class="chip" data-m="${m.key}" aria-pressed="${m.key===selMonth}"><b>${esc(monthLabel(m.key))}</b><span>${n?n+" launching":esc(m.aesthetic||"prep")}</span></button>`}).join("");
  const m=state.months.find(x=>x.key===selMonth);
  let body="";
  if(m){
    const launching=state.products.filter(p=>p.month===m.key);
    const t=launching.reduce((a,p)=>{const c=calc(p);a.cost+=c.totalCost;a.rev+=c.revenue;a.pro+=c.totalProfit;return a},{cost:0,rev:0,pro:0});
    const today=todayStr();
    const tasks=[];
    state.products.forEach(p=>{
      if(p.sampleBy&&p.sampleBy.startsWith(m.key))tasks.push({p,kind:"Order sample",date:p.sampleBy,late:p.sampleBy<today&&sIdx(p.status)<1,done:sIdx(p.status)>=1});
      if(p.orderBy&&p.orderBy.startsWith(m.key))tasks.push({p,kind:"Place bulk order",date:p.orderBy,late:p.orderBy<today&&sIdx(p.status)<2,done:sIdx(p.status)>=2});
    });
    tasks.sort((a,b)=>a.date.localeCompare(b.date));
    const isLast=state.months[state.months.length-1].key===m.key;
    body=`<section class="month">
      <h2>${esc(monthLabel(m.key,true))}</h2>
      <label class="field"><span>Theme for this month</span><input type="text" data-mf="theme" value="${esc(m.theme)}" placeholder="e.g. Valentine’s drop"></label>
      <label class="field"><span>Aesthetic or season</span><input type="text" data-mf="aesthetic" list="aesList" value="${esc(m.aesthetic)}" placeholder="e.g. Coquette"></label>
      <label class="field"><span>Focus and notes</span><textarea data-mf="focus" placeholder="What needs to happen this month?">${esc(m.focus)}</textarea></label>

      <h3 class="section-h">To do this month</h3>
      ${tasks.length?tasks.map(x=>`<div class="item"><div class="main"><div class="name">${esc(x.kind)}: ${esc(x.p.name)}</div>
        <div class="meta">${esc(x.p.aesthetic||"")}${x.p.supplier?" · "+esc(x.p.supplier):""}</div></div>
        <div class="due ${x.late?"late":""}">${x.done?"Done":(x.late?"Overdue ":"By ")+new Date(x.date+"T12:00").toLocaleString("en-US",{month:"short",day:"numeric"})}</div></div>`).join("")
        :`<p class="empty">No sample or order deadlines fall in this month.</p>`}

      <h3 class="section-h">Launching this month</h3>
      ${launching.length?`<div class="totals"><div><small>Stock cost</small><strong>${money(t.cost)}</strong></div><div><small>If it all sells</small><strong>${money(t.rev)}</strong></div><div><small>Profit</small><strong>${money(t.pro)}</strong></div></div>`+
        launching.map(p=>itemRow(p)).join(""):`<p class="empty">Nothing launching yet. Add a product and set its launch month to ${esc(monthLabel(m.key,true))}.</p>`}
      <div class="btnrow"><button class="btn" id="addHere">Add product to this month</button>
      ${isLast&&!launching.length&&state.months.length>1?`<button class="btn danger" id="rmMonth">Remove this month</button>`:""}</div>
    </section>`;
  }
  v.innerHTML=`<div class="strip">${chips}<button class="chip add" id="addMonth">+ Add ${esc(monthLabel(nextKey(state.months[state.months.length-1]?.key||curKey())))}</button></div>${body}${aesDatalist()}`;
  v.querySelectorAll(".chip[data-m]").forEach(b=>b.onclick=()=>{selMonth=b.dataset.m;render()});
  $("#addMonth").onclick=()=>{const k=nextKey(state.months[state.months.length-1]?.key||curKey());state.months.push({key:k,theme:"",aesthetic:"",focus:""});selMonth=k;persist();render();
    setTimeout(()=>{const c=document.querySelector(`.chip[data-m="${k}"]`);c&&c.scrollIntoView({inline:"end",block:"nearest"})},0)};
  v.querySelectorAll("[data-mf]").forEach(el=>el.oninput=()=>{m[el.dataset.mf]=el.value;persist()});
  v.querySelectorAll("[data-mf='aesthetic']").forEach(el=>el.onchange=()=>render());
  const ah=$("#addHere");if(ah)ah.onclick=()=>openEditor(null,m.key);
  const rm=$("#rmMonth");if(rm)rm.onclick=()=>{if(confirm("Remove "+monthLabel(m.key,true)+"?")){state.months.pop();selMonth=state.months[state.months.length-1].key;persist();render()}};
  wireItems(v);
  const sel=v.querySelector(`.chip[aria-pressed="true"]`);sel&&sel.scrollIntoView({inline:"center",block:"nearest"});
}

function itemRow(p){const c=calc(p);
  return `<div class="item"><div class="main"><div class="name">${esc(p.name)}</div>
    <div class="meta">${p.qty?esc(p.qty)+" units · ":""}${money(c.profit)} profit each (${c.margin.toFixed(0)}%)</div>
    <button class="textbtn" data-edit="${p.id}">Edit</button></div>${statusSelect(p)}</div>`}
function statusSelect(p){return `<select class="pill st-${esc(p.status||"idea")}" data-status="${p.id}" aria-label="Status for ${esc(p.name)}">${STATUSES.map(s=>`<option value="${s}" ${s===(p.status||"idea")?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>`}
function wireItems(v){
  v.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>{const p=state.products.find(x=>x.id===s.dataset.status);p.status=s.value;persist();render()});
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
}
function aesList(){return [...new Set([...state.products.map(p=>p.aesthetic),...state.months.map(m=>m.aesthetic)].filter(Boolean))].sort()}
function aesDatalist(){return `<datalist id="aesList">${aesList().map(a=>`<option value="${esc(a)}">`).join("")}</datalist>`}

function renderProducts(v){
  const list=state.products.filter(p=>(filt.month==="all"||p.month===filt.month)&&(filt.aes==="all"||p.aesthetic===filt.aes)&&(filt.status==="all"||(p.status||"idea")===filt.status))
    .sort((a,b)=>(a.month||"").localeCompare(b.month||"")||a.name.localeCompare(b.name));
  const tot=list.reduce((a,p)=>{const c=calc(p);a.cost+=c.totalCost;a.pro+=c.totalProfit;return a},{cost:0,pro:0});
  v.innerHTML=`<div class="filters">
    <select id="fM" aria-label="Launch month"><option value="all">All months</option>${state.months.map(m=>`<option value="${m.key}" ${filt.month===m.key?"selected":""}>${esc(monthLabel(m.key))}</option>`).join("")}</select>
    <select id="fA" aria-label="Aesthetic"><option value="all">All aesthetics</option>${aesList().map(a=>`<option ${filt.aes===a?"selected":""}>${esc(a)}</option>`).join("")}</select>
    <select id="fS" aria-label="Status"><option value="all">All statuses</option>${STATUSES.map(s=>`<option value="${s}" ${filt.status===s?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select></div>
    <div class="totals" style="margin-bottom:14px"><div><small>Products</small><strong>${list.length}</strong></div><div><small>Stock cost</small><strong>${money(tot.cost)}</strong></div><div><small>Profit if sold</small><strong>${money(tot.pro)}</strong></div></div>
    ${list.length?list.map(productCard).join(""):`<p class="empty">No products match these filters.</p>`}
    <div class="btnrow"><button class="btn" id="addP">Add product</button></div>`;
  $("#fM").onchange=e=>{filt.month=e.target.value;render()};
  $("#fA").onchange=e=>{filt.aes=e.target.value;render()};
  $("#fS").onchange=e=>{filt.status=e.target.value;render()};
  $("#addP").onclick=()=>openEditor(null,filt.month!=="all"?filt.month:selMonth);
  wireItems(v);
}
function productCard(p){const c=calc(p);
  const fd=d=>d?new Date(d+"T12:00").toLocaleString("en-US",{month:"short",day:"numeric"}):"—";
  return `<article class="card"><div class="top"><div><div class="name" style="font-weight:700">${esc(p.name)}</div>
    <div style="margin-top:4px">${p.aesthetic?`<span class="tag">${esc(p.aesthetic)}</span>`:""}${p.season?`<span class="tag" style="background:var(--sage-soft)">${esc(p.season)}</span>`:""}<span class="meta" style="font-size:.8rem;color:var(--soft)">Launch ${p.month?esc(monthLabel(p.month)):"—"}</span></div></div>
    ${statusSelect(p)}</div>
    <div class="nums"><span>Landed <b>${money(c.landed)}</b></span><span>Retail <b>${money(num(p.retail))}</b></span><span>Profit <b>${money(c.profit)}</b> (${c.margin.toFixed(0)}%)</span><span>Qty <b>${esc(p.qty||0)}</b></span></div>
    <div class="nums" style="color:var(--soft)"><span>Sample by ${fd(p.sampleBy)}</span><span>Order by ${fd(p.orderBy)}</span>${p.moq?`<span>Min order ${esc(p.moq)}</span>`:""}</div>
    ${p.supplier||p.link?`<div class="nums">${esc(p.supplier||"")} ${p.link?`<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">Open supplier</a>`:""}</div>`:""}
    <button class="textbtn" data-edit="${p.id}">Edit</button></article>`}

function renderBrand(v){
  const b=state.brand;
  v.innerHTML=`<div class="brandpage">
    <p class="lede">The words behind the shop. Edit anything; it saves as you type.</p>
    <label class="field"><span>Shop name</span><input type="text" data-bf="name" value="${esc(b.name)}"></label>
    <label class="field"><span>Tagline</span><input type="text" data-bf="tagline" value="${esc(b.tagline)}"></label>

    <label class="field"><span>About</span><textarea data-bf="about" style="min-height:220px">${esc(b.about)}</textarea></label>
    <h3 class="section-h">Backup</h3>
    <p class="empty" style="padding-top:0">Your plan is saved in this browser only. Download a backup now and then, and restore it on a new phone or computer.</p>
    <div class="btnrow" style="margin-top:0"><button class="btn ghost" id="dlB">Download backup</button><label class="btn ghost" style="display:inline-block">Restore backup<input type="file" id="upB" accept=".json,application/json" hidden></label></div>
    <p id="bMsg" class="due" role="status" style="min-height:1em"></p>
    <h3 class="section-h">Theme</h3>
    <div class="btnrow" style="margin-top:0"><button class="btn ghost" data-th="">Match device</button><button class="btn ghost" data-th="light">Light</button><button class="btn ghost" data-th="dark">Dark</button></div>
  </div>`;
  v.querySelectorAll("[data-bf]").forEach(el=>el.oninput=()=>{b[el.dataset.bf]=el.value;persist();
    if(el.dataset.bf==="name")$("#brandName").textContent=el.value||"The Romanticized Life";
    if(el.dataset.bf==="tagline")$("#brandTag").textContent=el.value||"Product calendar"});
  $("#dlB").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="romanticized-life-calendar-"+todayStr()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $("#upB").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.months)||!Array.isArray(d.products))throw 0;
    if(!confirm("Replace your current plan with this backup?"))return;state=d;normalize();selMonth=pickStartMonth();persist();render();$("#bMsg").textContent="Backup restored."}
    catch(err){$("#bMsg").textContent="That file isn’t a calendar backup. Choose the .json file you downloaded from this app."}};r.readAsText(file)};
  v.querySelectorAll("[data-th]").forEach(bt=>bt.onclick=()=>{const t=bt.dataset.th;if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");
    try{localStorage.setItem("trl-theme",t)}catch(e){}});
}

/* ---------- editor ---------- */
function openEditor(id,monthKey){
  const ex=id?state.products.find(p=>p.id===id):null;
  const p=ex?{...ex}:{id:uid(),name:"",month:monthKey||state.months[0]?.key||"",aesthetic:state.months.find(m=>m.key===monthKey)?.aesthetic||"",season:"",status:"idea",supplier:"",link:"",moq:"",unitCost:"",shipPerUnit:"",retail:"",qty:"",sampleBy:"",orderBy:"",notes:""};
  const f=(k,label,type="text",extra="")=>`<label class="field"><span>${label}</span><input type="${type}" name="${k}" value="${esc(p[k])}" ${extra}></label>`;
  $("#sheet").innerHTML=`<h3>${ex?"Edit product":"New product"}</h3>
    <form id="pf" novalidate>
    ${f("name","Product name","text",'required placeholder="e.g. Pink bow makeup pouch"')}
    <div class="row2"><label class="field"><span>Launch month</span><select name="month">${state.months.map(m=>`<option value="${m.key}" ${p.month===m.key?"selected":""}>${esc(monthLabel(m.key,true))}</option>`).join("")}</select></label>

    <datalist id="aesList2">${aesList().map(a=>`<option value="${esc(a)}">`).join("")}</datalist>
    <div class="row2">${f("sampleBy","Order sample by","date")}${f("orderBy","Place bulk order by","date")}</div>
    ${f("supplier","Supplier","text",'placeholder="Store name"')}
    ${f("link","Supplier link","url",'placeholder="https://"')}
    <div class="row3">${f("unitCost","Unit cost ($)","number",'step="0.01" min="0" inputmode="decimal"')}${f("shipPerUnit","Shipping + duties per unit ($)","number",'step="0.01" min="0" inputmode="decimal"')}${f("retail","Retail price ($)","number",'step="0.01" min="0" inputmode="decimal"')}</div>
    <div class="row2">${f("qty","Quantity to order","number",'step="1" min="0" inputmode="numeric"')}${f("moq","Supplier minimum","text",'placeholder="e.g. 50 pcs"')}</div>
    <div class="calc" id="calcOut"></div>
    <label class="field"><span>Notes</span><textarea name="notes" placeholder="Colors, sample quality, packaging ideas…">${esc(p.notes)}</textarea></label>
    <p id="formErr" class="due late" role="alert" style="min-height:1em"></p>
    <div class="btnrow"><button type="submit" class="btn">Save product</button><button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
    ${ex?`<button type="button" class="btn danger" id="delBtn">Delete</button>`:""}</div></form>`;
  const form=$("#pf");
  const read=()=>{const o={...p};new FormData(form).forEach((val,k)=>o[k]=typeof val==="string"?val.trim():val);return o};
  const upd=()=>{const c=calc(read());$("#calcOut").innerHTML=`Landed cost <b>${money(c.landed)}</b> · Profit each <b>${money(c.profit)}</b> (${c.margin.toFixed(0)}%) · Order total <b>${money(c.totalCost)}</b>${c.margin&&c.margin<50?`<br><span class="due late">Margin is under 50% — consider a higher price or bundling.</span>`:""}`};
  form.oninput=upd;upd();
  form.onsubmit=e=>{e.preventDefault();const o=read();
    if(!o.name){$("#formErr").textContent="Add a product name to save.";return}
    if(o.sampleBy&&o.orderBy&&o.orderBy<o.sampleBy){$("#formErr").textContent="The bulk order date is before the sample date. Adjust one of them.";return}
    if(ex)Object.assign(ex,o);else state.products.push(o);
    persist();$("#dlg").close();render()};
  $("#cancelBtn").onclick=()=>$("#dlg").close();
  const d=$("#delBtn");if(d)d.onclick=()=>{if(confirm("Delete "+ex.name+"?")){state.products=state.products.filter(x=>x.id!==ex.id);persist();$("#dlg").close();render()}};
  $("#dlg").showModal();
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo({top:0})});
try{const t=localStorage.getItem("trl-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
render();init();
</script>
</body>
</html>
